<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lägg till erfarenhet | Mitt CV</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/add.js" defer></script>
</head>

<body>
    <header>
        <h1>Mitt CV</h1>

        <nav aria-label="Huvudmeny">
            <ul>
                <li><a href="index.html">Startsida</a></li>
                <li><a href="add.html" aria-current="page">Lägg till erfarenhet</a></li>
                <li><a href="about.html">Om webbplatsen</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Lägg till arbetslivserfarenhet</h2>
            <p>Fyll i formuläret för att lägga till en ny arbetslivserfarenhet.</p>

            <form id="experience-form" novalidate>

                <div class="form-group">
                    <label for="companyname">Företag</label>
                    <input type="text" id="companyname" name="companyname" required>
                </div>

                <div class="form-group">
                    <label for="jobtitle">Yrkesroll</label>
                    <input type="text" id="jobtitle" name="jobtitle" required>
                </div>

                <div class="form-group">
                    <label for="location">Ort</label>
                    <input type="text" id="location" name="location" required>
                </div>

                <div class="form-group">
                    <label for="startdate">Startdatum</label>
                    <input type="text" id="startdate" name="startdate" required>
                </div>

                <div class="form-group">
                    <label for="enddate">Slutdatum</label>
                    <input type="text" id="enddate" name="enddate" required>
                </div>

                <div class="form-group">
                    <label for="description">Beskrivning</label>
                    <textarea id="description" name="description" rows="5" required></textarea>
                </div>

                <button type="submit">Lägg till erfarenhet</button>

                <div id="form-message" role="status" aria-live="polite"></div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Emma Ågren</p>
    </footer>
    
</body>
</html>
